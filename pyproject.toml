[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdr-agent"
version = "0.1.0"
description = "Evidence-based sales call analysis and human review"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.66.0,<2", "pydantic>=2.14.1,<3", "httpx>=0.28.1,<1", "python-dotenv>=1.2.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdr_agent = ["prompts/*.md", "styles.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
